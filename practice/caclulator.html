<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      button {
        margin-bottom: 15px;
      }
    </style>
  </head>
  <body>
    <p>Calculator</p>
    <div>
      <button onclick="calculation += '1';
        console.log(`${calculation}\n`);">1</button>
      <button onclick="calculation += '2';
        console.log(`${calculation}\n`);">2</button>
      <button onclick="calculation += '3';
        console.log(`${calculation}\n`);">3</button>
      <button onclick="calculation += ' + ';
        console.log(`${calculation}\n`);">+</button>
    </div>

    <div>
      <button onclick="calculation += '4';
        console.log(`${calculation}\n`);">4</button>
      <button onclick="calculation += '5';
        console.log(`${calculation}\n`);">5</button>
      <button onclick="calculation += '6';
        console.log(`${calculation}\n`);">6</button>
      <button onclick="calculation += ' - ';
        console.log(`${calculation}\n`);">-</button>
    </div>

    <div>
      <button onclick="calculation += '7';
        console.log(`${calculation}\n`);">7</button>
      <button onclick="calculation += '8';
        console.log(`${calculation}\n`);">8</button>
      <button onclick="calculation += '9';
        console.log(`${calculation}\n`);">9</button>
      <button onclick="calculation += ' * ';
        console.log(`${calculation}\n`);">*</button>
    </div>

    <div>
      <button onclick="calculation += '0';
        console.log(`${calculation}\n`);">0</button>
      <button onclick="calculation += '.';
        console.log(`${calculation}\n`);">.</button>
      <button onclick="calculation += eval(calculation);
        console.log(`\n${calculation}\n`);">=</button>
      <button onclick="calculation += ' / ';
        console.log(`${calculation}\n`);">/</button>
    </div>
    <button onclick="calculation = '';
    console.log('Cleared.');">Clear</button>
    <script>
      let calculation = "";
    </script>
  </body>
</html>
